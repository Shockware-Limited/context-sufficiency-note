name: build
on: [push, pull_request]
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - run: cd paper && tectonic main.tex
      - uses: actions/upload-artifact@v4
        with: { name: paper, path: paper/main.pdf }
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: sufficiency
          use-mathlib-cache: true
      - name: no sorry / admit / native_decide
        run: '! grep -rnE "sorry|admit|native_decide" sufficiency/Sufficiency'
      - name: axiom audit
        run: |
          cd sufficiency
          lake env lean Axioms.lean | tee axioms.txt
          python3 - <<'PY'
          import re
          ok = {"propext", "Classical.choice", "Quot.sound"}
          bad = False
          for line in open("axioms.txt"):
              m = re.search(r"depends on axioms: \[(.*)\]", line)
              if m:
                  used = {a.strip() for a in m.group(1).split(",") if a.strip()}
                  extra = used - ok
                  if extra:
                      print("UNEXPECTED AXIOMS:", line.strip()); bad = True
          raise SystemExit(1 if bad else 0)
          PY
